# Site statique habibiserver.dev — le TLS est gere par le reverse proxy Caddy devant.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 500 502 503 504 /error.html;

    location = /error.html {
        internal;
    }
}
