# Site statique habibiserver.dev.
# TLS, compression (encode gzip) et HTTP/2 sont geres par le reverse proxy
# Caddy devant (projet figutab) ; ici on ne fait que servir les fichiers.
server_tokens off;

# Cache navigateur : HTML toujours revalide, assets (favicon...) 7 jours.
map $uri $cache_control {
    default                          "no-cache";
    ~*\.(png|ico|svg|jpg|jpeg|webp)$ "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # En-tetes de securite (always : aussi sur les pages d'erreur)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Pas de script sur le site, styles inline uniquement.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fichiers caches (.git, .env...) : jamais servis, meme s'ils etaient copies
    location ~ /\. {
        deny all;
    }

    error_page 403 404 500 502 503 504 /error.html;

    location = /error.html {
        internal;
    }
}
